<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&M Jewelry | Administración</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{max-width:1100px;margin:0 auto;padding:48px 20px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:20px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#59635d}.field input,.field textarea,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.field textarea{min-height:110px;resize:vertical}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:14px 16px;border-radius:12px;background:#eef3ef;color:#2c4e3d;font-size:13px;margin-bottom:18px}.product-row{display:grid;grid-template-columns:1.2fr .9fr .8fr 1.3fr auto;gap:10px;align-items:end;border-top:1px solid var(--line);padding:18px 0}.product-row:first-child{border-top:0}.small{font-size:12px;color:#737b76}.hidden{display:none!important}.login{max-width:460px;margin:80px auto}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.product-row{grid-template-columns:1fr 1fr}.product-row .full{grid-column:1/-1}}</style></head><body><div class="announcement">M&M JEWELRY · PANEL DE ADMINISTRACIÓN</div><main class="admin-wrap"><section class="login admin-card" id="loginCard"><p class="eyebrow">ACCESO PRIVADO</p><h1 style="font-size:48px">Administrar M&amp;M</h1><p class="small">Ingresá con el usuario que creaste en Supabase.</p><div class="field" style="margin-top:20px"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:12px"><label>Contraseña</label><input id="password" type="password"></div><div class="admin-actions"><button class="button button-dark" id="loginBtn">Ingresar</button></div><p id="loginMsg" class="small"></p></section><section id="adminApp" class="hidden"><div class="admin-card"><h1 style="font-size:52px">Panel de control</h1><p class="small">Desde acá vas a cambiar los textos y productos de la web.</p><div class="admin-actions"><button class="button button-outline" id="refreshBtn">Actualizar</button><button class="button button-dark" id="logoutBtn">Cerrar sesión</button></div></div><section class="admin-card"><p class="eyebrow">MARCA &amp; CONTACTO</p><h2 style="font-size:36px">Textos del sitio</h2><div class="admin-grid"><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>Título principal</label><input id="hero_title"></div><div class="field"><label>Texto principal</label><textarea id="hero_text"></textarea></div><div class="field"><label>Historia</label><textarea id="about_text"></textarea></div><div class="field"><label>Título contacto</label><input id="contact_title"></div><div class="field"><label>Texto contacto</label><textarea id="contact_text"></textarea></div></div><div class="admin-actions"><button class="button button-dark" id="saveSettings">Guardar textos</button></div><p id="settingsMsg" class="small"></p></section><section class="admin-card"><p class="eyebrow">CATÁLOGO</p><h2 style="font-size:36px">Productos</h2><div id="productsAdmin"></div><div class="admin-actions"><button class="button button-dark" id="addProduct">+ Agregar producto</button></div><p id="productsMsg" class="small"></p></section></section></main><script type="module" src="admin.js"></script></body></html>
