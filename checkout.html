<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Finalizar compra | M&M Jewelry" />
<title>Finalizar compra | M&M Jewelry</title>
<link rel="icon" href="assets/mm-logo.svg" />
<link rel="stylesheet" href="styles.css" />
<style>
.checkout-page{padding:42px 0 90px}.checkout-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:28px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}.panel h2{font-family:Georgia,serif;font-size:34px;margin:0 0 18px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#334039}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;background:#fff}.field textarea{min-height:90px;resize:vertical}.choice-grid{display:grid;gap:10px}.disabled-choice{opacity:.58;cursor:not-allowed}.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer}.choice input{margin-top:3px}.choice strong{display:block;color:#17201b}.choice span{display:block;color:#667069;font-size:13px;margin-top:2px}.order-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.order-item:last-child{border-bottom:0}.order-item img{width:64px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff}.order-item h3{font-size:15px;margin:0 0 4px}.order-item p{margin:0;font-size:13px;color:#667069}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0}.summary-total{font-size:24px;font-family:Georgia,serif;border-top:1px solid var(--line);margin-top:10px;padding-top:18px}.notice{padding:14px;border-radius:14px;background:#f3f6f2;color:#4f5a53;font-size:13px;line-height:1.5;margin-top:16px}.hidden{display:none}.success{padding:45px;text-align:center}.success h1{font-family:Georgia,serif;font-size:52px;margin:0 0 12px}.error{color:#a63a2b;font-size:13px;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.payment-details{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fafbf9}.payment-details h3{margin:0 0 10px;font-size:16px}.payment-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.payment-line:last-child{border-bottom:0}.payment-line span{font-size:13px;color:#667069}.payment-value{display:flex;align-items:center;gap:8px;font-weight:700;text-align:right}.copy-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;font:inherit;font-size:12px}.payment-help{margin:10px 0 0;font-size:12px;color:#667069;line-height:1.5}.reservation-box{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#f6f7f4}.reservation-box strong{font-size:15px}.reservation-timer{font-family:Georgia,serif;font-size:27px;margin-top:6px}.expired{color:#a63a2b;font-weight:700}
@media(max-width:900px){.checkout-layout{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="announcement">M&M JEWELRY · MONTERO & MONTERO · DESDE 1990</div>
<header class="site-header"><a class="brand" href="index.html"><img src="assets/mm-logo.svg" alt="M&M"><div><strong>M&M</strong><span>JEWELRY & WATCHES</span></div></a><nav class="nav"><a href="index.html#colecciones">Colecciones</a><a href="index.html#marcas">Marcas</a><a href="index.html#seiko">Seiko</a><a href="index.html#nosotros">Nosotros</a><a href="index.html#contacto">Contacto</a></nav><div class="header-actions"><a class="cart-link active" href="carrito.html">Carrito <span class="cart-count" id="cartCount">0</span></a></div></header>
<main><section class="section checkout-page"><div class="section-head"><div><p class="eyebrow">M&M JEWELRY</p><h1>Finalizar compra</h1></div><p>Completá tus datos para generar el pedido.</p></div><div id="root"></div></section></main>
<footer class="footer"><div><strong>M&M Jewelry</strong><span>Montero & Montero · Since 1990</span></div><div class="footer-links"><a href="index.html#colecciones">Colecciones</a><a href="index.html#marcas">Marcas</a><a href="index.html#contacto">Contacto</a></div><div class="footer-note">© M&M Jewelry</div></footer>
<script type="module">
import {getCart,cartTotal,updateCartCount,money} from './cart.js';
import {PAYMENT_INFO} from './payment-config.js';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY); const root=document.querySelector('#root'); updateCartCount();
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const cart=getCart();
if(!cart.length){root.innerHTML='<div class="cart-empty"><h2>Tu carrito está vacío.</h2><p>Agregá productos antes de continuar.</p><a class="button button-dark" href="index.html#catalogo">Ver productos</a></div>';}
else{
 const items=cart.map(x=>`<div class="order-item"><img src="${esc(x.image)}" alt="${esc(x.name)}"><div><h3>${esc(x.name)}</h3><p>${esc(x.brand||'M&M')} · ${x.qty} × ${money(x.display_price)}</p></div><strong>${money(x.display_price*x.qty)}</strong></div>`).join('');
 root.innerHTML=`<form id="checkoutForm"><div class="checkout-layout"><div class="panel"><h2>Datos de contacto</h2><div class="field-grid"><div class="field"><label for="firstName">Nombre *</label><input id="firstName" name="firstName" required autocomplete="given-name"></div><div class="field"><label for="lastName">Apellido *</label><input id="lastName" name="lastName" required autocomplete="family-name"></div><div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="phone">WhatsApp / teléfono *</label><input id="phone" name="phone" required autocomplete="tel"></div><div class="field full"><label for="delivery">Forma de entrega *</label><select id="delivery" name="delivery" required><option value="">Seleccionar</option><option value="pickup">Retiro en local</option><option value="shipping">Envío</option></select></div><div class="field full" id="addressWrap"><label for="address">Dirección</label><input id="address" name="address" autocomplete="street-address"></div><div class="field"><label for="city">Localidad</label><input id="city" name="city" autocomplete="address-level2"></div><div class="field"><label for="postalCode">Código postal</label><input id="postalCode" name="postalCode" autocomplete="postal-code"></div></div><h2 style="margin-top:34px">Medio de pago</h2><div class="choice-grid"><label class="choice"><input type="radio" name="payment" value="bank_transfer" required><span><strong>Transferencia bancaria</strong><span>Pago directo a la cuenta bancaria de M&M. Los datos bancarios se muestran al confirmar el pedido.</span></span></label><label class="choice disabled-choice"><input type="radio" name="payment" value="card" disabled><span><strong>Tarjeta de crédito o débito</strong><span>Próximamente. El procesamiento online todavía no está conectado.</span></span></label><label class="choice disabled-choice"><input type="radio" name="payment" value="mercado_pago" disabled><span><strong>Mercado Pago</strong><span>Próximamente. El pago automático todavía no está conectado.</span></span></label></div><div id="paymentNote" class="notice">Elegí un medio de pago. Para transferencia, los datos de M&M aparecerán acá y también quedarán visibles al confirmar el pedido.</div>
<div id="transferDetails" class="payment-details hidden"><h3>Datos para transferir</h3><div class="payment-line"><span>Proveedor</span><strong>Mercado Pago</strong></div><div class="payment-line"><span>Titular</span><strong>${esc(PAYMENT_INFO.holder)}</strong></div><div class="payment-line"><span>Alias</span><div class="payment-value"><strong>${esc(PAYMENT_INFO.alias)}</strong><button type="button" class="copy-btn" data-copy="${esc(PAYMENT_INFO.alias)}">Copiar</button></div></div><div class="payment-line"><span>CVU</span><div class="payment-value"><strong>•••• •••• •••• ${esc(PAYMENT_INFO.cvu.slice(-4))}</strong><button type="button" class="copy-btn" data-copy="${esc(PAYMENT_INFO.cvu)}">Copiar</button></div></div><div class="payment-line"><span>CUIT</span><strong>${esc(PAYMENT_INFO.cuit)}</strong></div><p class="payment-help">Realizá la transferencia por el importe exacto del pedido y conservá el comprobante. M&M verificará el ingreso antes de marcar el pedido como pagado.</p></div><div class="error" id="error"></div><div class="actions"><button class="button button-dark" id="submitBtn" type="submit">Confirmar pedido</button><a class="button button-outline" href="carrito.html">Volver al carrito</a></div></div><aside class="panel"><p class="eyebrow">RESUMEN</p><h2>Tu pedido</h2>${items}<div class="summary-row"><span>Subtotal</span><strong>${money(cartTotal())}</strong></div><div class="summary-row"><span>Entrega</span><strong id="deliveryPrice">A confirmar</strong></div><div class="summary-row summary-total"><span>Total</span><strong id="total">${money(cartTotal())}</strong></div><div class="notice">El precio que ves está expresado en pesos argentinos y es el vigente al momento de generar el pedido.</div></aside></div></form>`;
 const delivery=document.querySelector('#delivery'), addressWrap=document.querySelector('#addressWrap');
 delivery.addEventListener('change',()=>{const ship=delivery.value==='shipping'; addressWrap.style.display=ship?'flex':'none'; if(!ship) document.querySelector('#address').value='';}); addressWrap.style.display='none';
 const transferDetails=document.querySelector('#transferDetails'); const paymentNote=document.querySelector('#paymentNote'); document.querySelectorAll('input[name=payment]').forEach(r=>r.addEventListener('change',()=>{if(!r.checked)return; const on=r.value==='bank_transfer'; transferDetails.classList.toggle('hidden',!on); paymentNote.textContent=on?'Podés transferir a los datos de Mercado Pago que aparecen debajo. El pedido queda pendiente hasta que M&M verifique el ingreso.':(r.value==='card'?'Tarjeta seleccionada. La conexión con el procesador de tarjetas todavía no está habilitada.':'Mercado Pago seleccionado. El pago automático todavía no está habilitado.');})); document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(btn.dataset.copy);const old=btn.textContent;btn.textContent='Copiado ✓';setTimeout(()=>btn.textContent=old,1300);}catch{btn.textContent='No disponible';setTimeout(()=>btn.textContent='Copiar',1300);}}));
 document.querySelector('#checkoutForm').addEventListener('submit',async e=>{e.preventDefault(); const btn=document.querySelector('#submitBtn'); const err=document.querySelector('#error'); err.textContent=''; btn.disabled=true; btn.textContent='Procesando…'; const fd=new FormData(e.currentTarget); const payload={customer:{first_name:fd.get('firstName'),last_name:fd.get('lastName'),email:fd.get('email'),phone:fd.get('phone'),address:fd.get('address')||'',city:fd.get('city')||'',postal_code:fd.get('postalCode')||''},delivery_method:fd.get('delivery'),payment_method:fd.get('payment'),items:cart.map(x=>({product_id:x.id,quantity:x.qty}))}; try{ const {data,error}=await sb.rpc('create_order',{p_data:payload}); if(error) throw error; const order=data?.[0]||data; localStorage.removeItem('mmj_cart_v1'); updateCartCount(); root.innerHTML=`<div class="panel success"><p class="eyebrow">PEDIDO RECIBIDO</p><h1>Gracias por tu compra.</h1><p>Tu pedido fue registrado correctamente.</p><p><strong>Número de pedido:</strong> ${esc(order?.order_number||order?.id||'Pendiente')}</p><div class="reservation-box"><strong>Tu reserva está activa durante 30 minutos.</strong><div class="reservation-timer" id="reservationTimer">30:00</div><p class="payment-help">La pieza queda reservada durante este plazo mientras M&M espera y verifica el pago. Si no se confirma el pago, la reserva vence y vuelve a estar disponible.</p></div>${fd.get('payment')==='bank_transfer'?`<div class="payment-details"><h3>Datos para transferir</h3><div class="payment-line"><span>Proveedor</span><strong>Mercado Pago</strong></div><div class="payment-line"><span>Titular</span><strong>${esc(PAYMENT_INFO.holder)}</strong></div><div class="payment-line"><span>Alias</span><strong>${esc(PAYMENT_INFO.alias)}</strong></div><div class="payment-line"><span>CVU</span><strong>${esc(PAYMENT_INFO.cvu)}</strong></div><div class="payment-line"><span>CUIT</span><strong>${esc(PAYMENT_INFO.cuit)}</strong></div><p class="payment-help">Transferí el total indicado en el pedido y conservá el comprobante. La confirmación queda sujeta a la verificación de M&M.</p></div>`:''}<div class="actions" style="justify-content:center"><a class="button button-dark" href="index.html">Volver a la tienda</a></div></div>`;
 if (fd.get('payment')==='bank_transfer' && order?.created_at) {
   const started = new Date(order.created_at).getTime();
   const deadline = started + 30*60*1000;
   const timer = document.querySelector('#reservationTimer');
   const tick = () => { const left=Math.max(0,deadline-Date.now()); const sec=Math.ceil(left/1000); if(timer){ if(sec<=0){ timer.textContent='00:00'; timer.classList.add('expired'); } else { const m=String(Math.floor(sec/60)).padStart(2,'0'); const ss=String(sec%60).padStart(2,'0'); timer.textContent=`${m}:${ss}`; } } if(left<=0)clearInterval(iv); };
   const iv=setInterval(tick,1000); tick();
 }
}catch(ex){console.error(ex); err.textContent=ex?.message||'No pudimos registrar el pedido. Probá nuevamente.'; btn.disabled=false; btn.textContent='Confirmar pedido';}});
}
</script></body></html>
