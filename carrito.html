<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Carrito de M&M Jewelry"><title>Carrito | M&M Jewelry</title><link rel="icon" href="assets/mm-logo.svg"><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="announcement">M&M JEWELRY · MONTERO & MONTERO · DESDE 1990</div>
<header class="site-header"><a class="brand" href="index.html"><img src="assets/mm-logo.svg" alt="M&M"><div><strong>M&M</strong><span>JEWELRY & WATCHES</span></div></a><nav class="nav"><a href="index.html#colecciones">Colecciones</a><a href="index.html#marcas">Marcas</a><a href="index.html#seiko">Seiko</a><a href="index.html#nosotros">Nosotros</a><a href="index.html#contacto">Contacto</a></nav><div class="header-actions"><a class="cart-link active" href="carrito.html">Carrito <span class="cart-count" id="cartCount">0</span></a></div></header>
<main><section class="section cart-page"><div class="section-head"><div><p class="eyebrow">M&M JEWELRY</p><h1 class="cart-title">Tu carrito</h1></div><p>Revisá tus productos antes de continuar.</p></div><div id="cartRoot"></div></section></main>
<footer class="footer"><div><strong>M&M Jewelry</strong><span>Montero & Montero · Since 1990</span></div><div class="footer-links"><a href="index.html#colecciones">Colecciones</a><a href="index.html#marcas">Marcas</a><a href="index.html#contacto">Contacto</a></div><div class="footer-note">© M&M Jewelry</div></footer>
<script type="module">
import {getCart,saveCart,removeFromCart,setQty,cartTotal,updateCartCount,money} from './cart.js';
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function render(){const root=document.querySelector('#cartRoot'), cart=getCart(); updateCartCount(); if(!cart.length){root.innerHTML='<div class="cart-empty"><h2>Tu carrito está vacío.</h2><p>Agregá productos desde nuestro catálogo.</p><a class="button button-dark" href="index.html#catalogo">Ver productos</a></div>';return;} const rows=cart.map(x=>`<article class="cart-item"><img src="${esc(x.image)}" alt="${esc(x.name)}"><div><span class="muted">${esc(x.brand||'M&M')}</span><h3>${esc(x.name)}</h3><p>${money(x.display_price)} c/u</p><div class="qty"><button data-id="${x.id}" data-act="minus">−</button><span>${x.qty}</span><button data-id="${x.id}" data-act="plus" ${Number(x.stock||0)<=x.qty?'disabled':''}>+</button><button class="remove" data-id="${x.id}" data-act="remove">Eliminar</button></div></div><strong>${money(x.display_price*x.qty)}</strong></article>`).join(''); root.innerHTML=`<div class="cart-layout"><div class="cart-items">${rows}</div><aside class="cart-summary"><p class="eyebrow">RESUMEN</p><div class="summary-row"><span>Subtotal</span><strong>${money(cartTotal())}</strong></div><p class="summary-note">El envío y las opciones de entrega se definen en el checkout.</p><button class="button button-dark" id="checkoutBtn">Continuar compra</button><a class="button button-outline" href="index.html#catalogo">Seguir viendo productos</a></aside></div>`;
root.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;const x=getCart().find(v=>v.id===id);if(!x)return;if(b.dataset.act==='remove')removeFromCart(id);if(b.dataset.act==='minus')setQty(id,x.qty-1);if(b.dataset.act==='plus')setQty(id,x.qty+1);render();}));
root.querySelector('#checkoutBtn').addEventListener('click',()=>{window.location.href='checkout.html';});}
render();
</script></body></html>
